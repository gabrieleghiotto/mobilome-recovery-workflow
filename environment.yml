name: vp-workflow
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # Workflow orchestration & data handling
  - python=3.10
  - pandas>=1.5.0
  - numpy>=1.23.0
  - pyyaml>=6.0

  # Viral/plasmid mining
  - genomad=1.11.0

  # Quality assessment
  - checkv=1.0.1

  # Clustering
  - vclust=1.3.1

  # Alignment & sequence tools
  - blast>=2.13
  - seqkit>=2.10
  - minimap2>=2.20

  # Data analysis & visualization
  - scipy>=1.10.0
  - matplotlib>=3.5.0
  - seaborn>=0.12.0

  # Development tools
  - git
  - wget
  - curl

  # Utilities
  - parallel
  - pigz

  # Jupyter (optional)
  - jupyter
  - jupyterlab

- pip:
  - biopython>=1.80
  - tqdm>=4.64.0
